<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RoOS — Shell Prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="roos-root" class="desktop">
    <div class="topbar">
      <div class="title">RoOS</div>
      <div class="controls">
        <button id="theme-toggle">Toggle Theme</button>
      </div>
    </div>

    <div class="icons">
      <div class="icon" data-app="terminal">🖥️<span>Terminal</span></div>
      <div class="icon" data-app="files">📁<span>Files</span></div>
      <div class="icon" data-app="browser">🌐<span>Browser</span></div>
    </div>

    <div id="dock" class="dock">Dock: (click an icon)</div>
  </div>

  <!-- Start button and menu -->
  <div class="start-wrapper">
    <button id="start-button" aria-label="Start">
      <img src="../roro-icons/assets/roroStart.png" alt="Start">
    </button>
    <div id="start-menu" class="start-menu" aria-hidden="true">
      <div class="start-menu-header">RoRoOS</div>
      <ul class="start-menu-list">
        <li class="start-item">Terminal</li>
        <li class="start-item">Files</li>
        <li class="start-item">Browser</li>
        <li class="start-item">Settings</li>
      </ul>
    </div>
  </div>

  <script src="js/shell.js"></script>
</body>
</html>
